<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Guía móvil del V Congreso Cardiocete 2026 · Albacete, 11–12 de septiembre">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Cardiocete">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cardiocete 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E0334B">
<style>
:root{
  --bg:#F3F0F2;
  --bg2:#EDE7EA;
  --ink:#1C1C1E;
  --ink2:#5F5B60;
  --ink3:#8E8993;
  --line:rgba(28,28,30,.08);
  --glass:rgba(255,255,255,.62);
  --glass2:rgba(255,255,255,.78);
  --glass-strong:rgba(255,255,255,.86);
  --glass-border:rgba(255,255,255,.65);
  --shadow:0 10px 30px -12px rgba(60,30,40,.22), 0 1px 0 rgba(255,255,255,.7) inset;
  --accent:#E0334B;
  --accent-soft:rgba(224,51,75,.12);
  --accent-ink:#B31F35;
  --blue:#2F6FE4;
  --blue-soft:rgba(47,111,228,.12);
  --gold:#C98A1A;
  --gold-soft:rgba(201,138,26,.14);
  --green:#2E9C6A;
  --green-soft:rgba(46,156,106,.13);
  --violet:#7E5BD6;
  --violet-soft:rgba(126,91,214,.13);
  --fill:rgba(28,28,30,.05);
  --fill2:rgba(28,28,30,.09);
  --blob1:#FFB4BE;
  --blob2:#FFD9C2;
  --blob3:#D9CDF7;
  --blob4:#BFE3F5;
  --tab-bg:rgba(255,255,255,.72);
  --sheet:rgba(250,248,250,.92);
  --now:#E0334B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B10; --bg2:#12111A;
    --ink:#F5F5F7; --ink2:#B4B1BA; --ink3:#7E7A86;
    --line:rgba(255,255,255,.09);
    --glass:rgba(34,33,42,.58); --glass2:rgba(40,39,50,.72); --glass-strong:rgba(44,43,56,.86);
    --glass-border:rgba(255,255,255,.10);
    --shadow:0 14px 34px -14px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06) inset;
    --accent:#FF5C6E; --accent-soft:rgba(255,92,110,.16); --accent-ink:#FF7A88;
    --blue:#6B9CFF; --blue-soft:rgba(107,156,255,.16);
    --gold:#E4B04A; --gold-soft:rgba(228,176,74,.16);
    --green:#4FC48F; --green-soft:rgba(79,196,143,.15);
    --violet:#A88BFF; --violet-soft:rgba(168,139,255,.16);
    --fill:rgba(255,255,255,.07); --fill2:rgba(255,255,255,.12);
    --blob1:#7A2233; --blob2:#5A3A2A; --blob3:#33285C; --blob4:#1F3A4A;
    --tab-bg:rgba(20,20,26,.72); --sheet:rgba(24,23,30,.94); --now:#FF5C6E;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B10; --bg2:#12111A;
  --ink:#F5F5F7; --ink2:#B4B1BA; --ink3:#7E7A86;
  --line:rgba(255,255,255,.09);
  --glass:rgba(34,33,42,.58); --glass2:rgba(40,39,50,.72); --glass-strong:rgba(44,43,56,.86);
  --glass-border:rgba(255,255,255,.10);
  --shadow:0 14px 34px -14px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06) inset;
  --accent:#FF5C6E; --accent-soft:rgba(255,92,110,.16); --accent-ink:#FF7A88;
  --blue:#6B9CFF; --blue-soft:rgba(107,156,255,.16);
  --gold:#E4B04A; --gold-soft:rgba(228,176,74,.16);
  --green:#4FC48F; --green-soft:rgba(79,196,143,.15);
  --violet:#A88BFF; --violet-soft:rgba(168,139,255,.16);
  --fill:rgba(255,255,255,.07); --fill2:rgba(255,255,255,.12);
  --blob1:#7A2233; --blob2:#5A3A2A; --blob3:#33285C; --blob4:#1F3A4A;
  --tab-bg:rgba(20,20,26,.72); --sheet:rgba(24,23,30,.94); --now:#FF5C6E;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Roboto,Segoe UI,Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ambient background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85;will-change:transform}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:var(--blob1);animation:drift1 26s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-22vmax;top:8vh;background:var(--blob2);animation:drift2 32s ease-in-out infinite alternate}
.b3{width:55vmax;height:55vmax;left:-10vmax;bottom:-25vmax;background:var(--blob3);animation:drift3 30s ease-in-out infinite alternate}
.b4{width:40vmax;height:40vmax;right:-10vmax;bottom:-10vmax;background:var(--blob4);animation:drift1 38s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-9vmax,9vmax) scale(1.05)}}
@keyframes drift3{to{transform:translate(10vmax,-8vmax) scale(1.1)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none!important}*{transition:none!important}}

/* app shell */
.app{position:relative;z-index:1;max-width:640px;margin:0 auto;min-height:100vh;
  padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--tab-bg);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid var(--line);}
.topbar .kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.topbar h1{margin:2px 0 0;font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.topbar .sub{color:var(--ink2);font-size:14px;margin-top:4px}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  border:1px solid var(--glass-border);box-shadow:var(--shadow);border-radius:20px}
.card{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.section{margin-top:22px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.section-title h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.section-title .meta{font-size:13px;color:var(--ink3)}

/* segmented */
.seg{display:flex;padding:3px;border-radius:14px;background:var(--fill2);gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-weight:600;font-size:14px;color:var(--ink2);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg small{display:block;font-weight:500;font-size:11px;color:var(--ink3);margin-top:1px}
.seg button[aria-pressed="true"] small{color:var(--ink2)}
.toolbar{display:flex;gap:8px;align-items:center;margin-top:10px}
.toolbar .seg{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;background:var(--fill2);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:#fff}

/* now card */
.now{position:relative;overflow:hidden;padding:16px;border-radius:22px;color:#fff;
  background:linear-gradient(135deg,#E0334B 0%,#C22344 60%,#8B1E4A 100%);box-shadow:0 14px 32px -12px rgba(224,51,75,.55)}
.now .lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.now .dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.now h3{margin:8px 0 4px;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.now p{margin:0;font-size:14px;opacity:.9}
.now .next{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);font-size:13px;opacity:.95}
.now .next b{font-weight:700}
.now .heart{position:absolute;right:-18px;top:-22px;width:130px;height:130px;opacity:.16}

/* agenda */
.block{overflow:hidden}
.block-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.block-head .time{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.block-head h3{margin:3px 0 0;font-size:17px;line-height:1.3;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.block-head .kind{display:inline-block;margin-right:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--fill2);color:var(--ink2);vertical-align:2px;letter-spacing:.03em}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px 4px 5px;border-radius:999px;background:var(--fill);font-size:12px;color:var(--ink2);max-width:100%}
.pill .av{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pill .r{font-weight:700;color:var(--ink3);font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.pill span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess{display:grid;grid-template-columns:54px 1fr 36px;gap:10px;align-items:start;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;position:relative;transition:background .15s}
.sess:last-child{border-bottom:0}
.sess:active{background:var(--fill)}
.sess .t{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);padding-top:2px;line-height:1.2}
.sess .t small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.sess .ti{font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
.sess .sp{margin-top:4px;font-size:13px;color:var(--ink2);line-height:1.35}
.sess .sp b{font-weight:600;color:var(--ink)}
.sess.live::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--now)}
.sess.live .t{color:var(--now)}
.sess.past{opacity:.62}
.star{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);margin-top:-4px;transition:transform .15s}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--gold)}
.star:active{transform:scale(1.2)}
.plain{display:flex;align-items:center;gap:12px;padding:12px 14px}
.plain .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.plain .t{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:52px}
.plain .ti{font-weight:600;font-size:15px}
.plain .ti small{display:block;font-weight:400;color:var(--ink2);font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* search + list */
.search{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--fill2)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;min-width:0}
.search input::placeholder{color:var(--ink3)}
.search svg{width:18px;height:18px;color:var(--ink3);flex:none}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--fill)}
.av-lg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em}
.row .n{font-weight:600;font-size:15px;line-height:1.25}
.row .o{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.row .c{font-size:12px;color:var(--ink3);font-weight:600;background:var(--fill);padding:3px 8px;border-radius:999px;white-space:nowrap}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:10px -2px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip-btn{padding:7px 11px;font-size:12px}

/* info rows */
.irow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);color:inherit}
.irow:last-child{border-bottom:0}
.irow .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px}
.irow .l{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.irow .v{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.irow .v small{display:block;font-weight:400;color:var(--ink2);font-size:13px;margin-top:1px}
.irow .go{color:var(--ink3);font-size:18px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:12px;font-weight:600;padding:5px 9px;border-radius:9px;background:var(--fill)}
.ic.red{background:var(--accent-soft);color:var(--accent-ink)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.ic.gold{background:var(--gold-soft);color:var(--gold)}
.ic.green{background:var(--green-soft);color:var(--green)}
.ic.violet{background:var(--violet-soft);color:var(--violet)}
.ic.grey{background:var(--fill2);color:var(--ink2)}

.hero{position:relative;overflow:hidden;padding:18px 16px}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h3{margin:6px 0 4px;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--ink2);font-size:14px}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{padding:10px 10px;border-radius:14px;background:var(--fill)}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.prose{font-size:15px;line-height:1.5;color:var(--ink)}
.prose p{margin:0 0 10px}
.prose p:last-child{margin-bottom:0}
.prose b{font-weight:650}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table td.d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.table td.d small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.table tr.hl td{background:var(--accent-soft)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;letter-spacing:.03em;text-transform:uppercase}
.tag.free{background:var(--green-soft);color:var(--green)}
.tag.pay{background:var(--fill2);color:var(--ink2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.event{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:start}
.event:last-child{border-bottom:0}
.event .t{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--accent);padding-top:2px}
.event .ti{font-weight:600;font-size:15px;line-height:1.3}
.event .w{font-size:13px;color:var(--ink2);margin-top:2px}
.event .w a{font-weight:600}
.place{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);align-items:center}
.place:last-child{border-bottom:0}
.place .n{font-weight:650;font-size:15px}
.place .d{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.place .k{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.map-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue);font-size:18px;flex:none}
.map-btn.sm{width:34px;height:34px;font-size:15px;border-radius:10px}
.note{font-size:12.5px;color:var(--ink3);line-height:1.45;margin:8px 6px 0}
.note a{color:var(--ink2);text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-weight:600;font-size:15px;background:var(--fill2);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.btn-row .btn{width:100%}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar-inner{width:100%;max-width:560px;display:flex;justify-content:space-around;padding:8px 4px 6px;border-radius:26px;
  background:var(--tab-bg);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);
  border:1px solid var(--glass-border);box-shadow:0 12px 34px -10px rgba(0,0,0,.28)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:14px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.01em;min-width:56px;transition:color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent)}

/* sheet */
.sheet-bd{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet-bd.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;
  background:var(--sheet);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  border-radius:26px 26px 0 0;border:1px solid var(--glass-border);border-bottom:0;box-shadow:0 -10px 40px rgba(0,0,0,.25);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,0,1);padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:translateY(0)}
.handle{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:4px auto 14px}
.sheet .k{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.sheet h3{margin:6px 0 6px;font-size:21px;line-height:1.25;font-weight:750;letter-spacing:-.015em;text-wrap:balance}
.sheet .m{color:var(--ink2);font-size:14px}
.sheet .grp{margin-top:16px}
.sheet .grp h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.sheet .prow{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sheet .prow:last-child{border-bottom:0}
.sheet .prow .n{font-weight:600;font-size:15px}

function madridNow(){ // fecha/hora actual en Europe/Madrid
  const s=new Date().toLocaleString('sv-SE',{timeZone:'Europe/Madrid',hour12:false});
  const [d,t]=s.split(' '); return {date:d,time:t.slice(0,5),min:+t.slice(0,2)*60+ +t.slice(3,5)};
}
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3,5);
function todayDay(){const n=madridNow();return DAYS.find(x=>x.d===n.date)||null}
if(!state.day){const td=todayDay(); state.day=td?td.id:(madridNow().date>'2026-09-12'?'sab':'vie');}
function person(id){const [n,o]=P[id].split('|');return {id,n,o}}
function initials(n){return n.replace(/^(Dr\.|Dra\.|D\.|Dña\.)\s*/,'').normalize('NFD').replace(/[̀-ͯ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
const AVC=['#E0334B','#2F6FE4','#7E5BD6','#2E9C6A','#C98A1A','#D9556B','#3B8EA5','#8E5BA0'];
function avColor(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length]}
function mapsQ(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function gcal(title,date,s,e,details,loc){
  const z=(d,t)=>{const dt=new Date(`${d}T${t}:00+02:00`);return dt.toISOString().replace(/[-:]|\.\d{3}/g,'')};
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+z(date,s)+'/'+z(date,e)+'&details='+encodeURIComponent(details)+'&location='+encodeURIComponent(loc)+'&ctz=Europe/Madrid';
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}

// índice de sesiones "planas" (todas las intervenciones con horario) y de ponentes
const ALL=[];
PROGRAM.forEach(b=>{
  if(b.type==='plain'){ALL.push({...b,block:null});return}
  if(!b.sessions.length) ALL.push({id:b.id,day:b.day,s:b.s,e:b.e,title:b.title,roles:b.roles,block:b,isBlock:true});
  b.sessions.forEach(x=>ALL.push({...x,day:b.day,block:b}));
});
const SPEAKERS={};
function addRole(pid,role,ref){(SPEAKERS[pid]??={...person(pid),items:[]}).items.push({role,...ref})}
PROGRAM.forEach(b=>{ if(b.type!=='block')return;
  Object.entries(b.roles||{}).forEach(([r,ids])=>ids.forEach(id=>addRole(id,r,{day:b.day,s:b.s,e:b.e,title:b.title,sid:b.id,block:true})));
  b.sessions.forEach(x=>Object.entries(x.roles||{}).forEach(([r,ids])=>ids.forEach(id=>addRole(id,r,{day:b.day,s:x.s,e:x.e,title:x.title,sid:x.id}))));
});
const SPEAKER_LIST=Object.values(SPEAKERS).sort((a,b)=>a.n.replace(/^(Dr\.|Dra\.|D\.)\s*/,'').localeCompare(b.n.replace(/^(Dr\.|Dra\.|D\.)\s*/,''),'es'));
const CITY=o=>{const m=o.match(/,\s*([^,]+)$/);if(m)return m[1].trim();if(/Albacete/.test(o))return 'Albacete';if(/CNIC/.test(o))return 'Madrid';if(/Bellvitge/.test(o))return 'Barcelona';return 'Otros'};
const CITIES=['Todos',...[...new Set(SPEAKER_LIST.map(s=>CITY(s.o)))].sort((a,b)=>a.localeCompare(b,'es'))];

const TABS=[{id:'agenda',l:'Agenda',i:'agenda'},{id:'ponentes',l:'Ponentes',i:'people'},{id:'feria',l:'Feria',i:'feria'},{id:'albacete',l:'Albacete',i:'city'},{id:'info',l:'Info',i:'info'}];

function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" id="tab-${t.id}" aria-selected="${state.tab===t.id}" data-tab="${t.id}">${I[t.i]}<span>${t.l}</span></button>`).join('');
}
function setTab(id){state.tab=id;try{localStorage.setItem('cc26.tab',id)}catch(e){};renderTabs();render();window.scrollTo({top:0})}

function header(k,h,sub){$('#topbar').innerHTML=`<div class="kicker">${k}</div><h1>${h}</h1>${sub?`<div class="sub">${sub}</div>`:''}`}

function pills(roles,limitRoles){
  return Object.entries(roles||{}).filter(([r])=>!limitRoles||limitRoles.includes(r)).flatMap(([r,ids])=>ids.map(id=>{const p=person(id);
    return `<span class="pill"><span class="av" style="background:${avColor(p.n)}">${initials(p.n)}</span><span class="r">${ROLE_SHORT[r]}</span><span class="n">${esc(p.n)}</span></span>`})).join('');
}
function speakersLine(roles){
  const parts=[];const order=['caso','pon','exp'];
  order.forEach(r=>{(roles[r]||[]).forEach(id=>{const p=person(id);parts.push(`<span><b>${esc(p.n)}</b> <span style="color:var(--ink3)">· ${ROLE_SHORT[r]}</span></span>`)})});
  return parts.join('<br>');
}
function starBtn(id){const on=favs.has(id);return `<button class="star" data-fav="${id}" aria-pressed="${on}" aria-label="${on?'Quitar de mi agenda':'Guardar en mi agenda'}">${on?I.star:I.starO}</button>`}

function renderAgenda(){
  const day=DAYS.find(d=>d.id===state.day);const now=madridNow();const isToday=now.date===day.d;
  header('V Congreso · Controversias en cardioagudos','Cardiocete 2026',`${VENUE.name} · Albacete · 11–12 sept`);
  const items=PROGRAM.filter(b=>b.day===state.day);
  let html=`<div class="toolbar">
    <div class="seg" role="group" aria-label="Día">${DAYS.map(d=>`<button data-day="${d.id}" aria-pressed="${d.id===state.day}">${d.label} ${d.num}<small>${d.id==='vie'?'16:45 – 20:30':'09:00 – 21:30'}</small></button>`).join('')}</div>
    <button class="chip-btn" id="favToggle" aria-pressed="${state.onlyFavs}">${I.star.replace('<svg','<svg width="14" height="14"')} Mi agenda</button>
  </div>`;

  // Ahora / siguiente
  if(isToday){
    const flat=ALL.filter(x=>x.day===state.day && !x.isBlock);
    const cur=flat.find(x=>toMin(x.s)<=now.min && now.min<toMin(x.e));
    const next=flat.find(x=>toMin(x.s)>now.min);
    if(cur||next){
      html+=`<div class="section"><div class="now fade">${I.heart.replace('<svg','<svg class="heart"')}
        <div class="lbl"><span class="dot"></span>${cur?'Ahora mismo':'A continuación'} · ${now.time}</div>
        <h3>${esc((cur||next).title)}</h3>
        <p>${(cur||next).s}–${(cur||next).e}${(cur||next).block?' · '+esc((cur||next).block.title):''}</p>
        ${cur&&next?`<div class="next">Siguiente <b>${next.s}</b> · ${esc(next.title)}</div>`:''}
      </div></div>`;
    }else if(now.min>=toMin(flat[flat.length-1].e)){
      html+=`<div class="section"><div class="glass card" style="text-align:center;color:var(--ink2)">Jornada del ${day.label.toLowerCase()} finalizada${state.day==='vie'?'. Mañana empezamos a las 09:00.':'. ¡Gracias por venir a Cardiocete!'}</div></div>`;
    }
  }else if(!todayDay()&&now.date<'2026-09-11'){
    const ms=new Date('2026-09-11T16:45:00+02:00')-new Date();const dd=Math.ceil(ms/864e5);
    html+=`<div class="section"><div class="now">${I.heart.replace('<svg','<svg class="heart"')}<div class="lbl">Cuenta atrás</div><h3>${dd===1?'Mañana':dd+' días'} para la inauguración</h3><p>Viernes 11 de septiembre · 16:45 h · ${VENUE.name}</p></div></div>`;
  }

  html+=`<div class="section stack" id="timeline">`;
  let any=false;
  items.forEach(b=>{
    if(b.type==='plain'){
      if(state.onlyFavs && !favs.has(b.id)) return; any=true;
      const past=isToday&&now.min>=toMin(b.e);
      html+=`<button class="glass plain sess-open ${past?'past':''}" data-open="${b.id}" style="width:100%;text-align:left"><span class="ic ${b.color}">${b.icon}</span><span class="t">${b.s}</span><span class="ti">${esc(b.title)}${b.sub?`<small>${esc(b.sub)}</small>`:''}</span></button>`;
      return;
    }
    const sess=b.sessions.filter(x=>!state.onlyFavs||favs.has(x.id));
    if(state.onlyFavs && !sess.length && !favs.has(b.id)) return; any=true;
    const bpast=isToday&&now.min>=toMin(b.e);
    html+=`<div class="glass block ${bpast?'past':''}">
      <button class="block-head sess-open" data-open="${b.id}" style="width:100%;text-align:left;display:block">
        <div class="time">${b.s} – ${b.e}</div>
        <h3><span class="kind">${b.kind}</span>${esc(b.title)}</h3>
        <div class="people">${pills(b.roles)}</div>
      </button>`;
    sess.forEach(x=>{
      const live=isToday&&toMin(x.s)<=now.min&&now.min<toMin(x.e);const past=isToday&&now.min>=toMin(x.e);
      html+=`<div class="sess ${live?'live':''} ${past?'past':''}">
        <button class="t sess-open" data-open="${x.id}" style="text-align:left">${x.s}<small>${x.e}</small></button>
        <button class="sess-open" data-open="${x.id}" style="text-align:left"><div class="ti">${esc(x.title)}</div>${Object.keys(x.roles).length?`<div class="sp">${speakersLine(x.roles)}</div>`:''}</button>
        ${starBtn(x.id)}
      </div>`;
    });
    if(!b.sessions.length){
      html+=`<div class="sess" style="grid-template-columns:1fr 36px"><div><div class="sp" style="margin-top:0">${b.kind==='Concurso'?'Presentación y defensa de casos clínicos por residentes y adjuntos ante el jurado.':'Conversación abierta con los expertos, café en mano.'}</div></div>${starBtn(b.id)}</div>`;
    }
    html+=`</div>`;
  });
  if(!any) html+=`<div class="glass empty"><b>Todavía no has guardado nada</b>Toca la estrella de una sesión para montar tu agenda del ${day.label.toLowerCase()}.</div>`;
  html+=`</div><p class="note">Horarios según el programa científico oficial. Toca cualquier sesión para ver ponentes, guardarla o añadirla a tu calendario.</p>`;
  $('#view').innerHTML=html;
}

function renderPonentes(){
  header('Quién es quién','Ponentes',`${SPEAKER_LIST.length} profesionales · ${CITIES.length-1} ciudades`);
  const q=state.q.trim().toLowerCase();
  const list=SPEAKER_LIST.filter(s=>(state.pf==='Todos'||CITY(s.o)===state.pf)&&(!q||(s.n+' '+s.o).toLowerCase().includes(q)));
  let html=`<div class="section" style="margin-top:8px"><div class="search">${I.search}<input id="q" type="search" placeholder="Buscar por nombre u hospital" value="${esc(state.q)}" autocomplete="off"></div>
  <div class="filters">${CITIES.map(c=>`<button class="chip-btn" data-pf="${esc(c)}" aria-pressed="${state.pf===c}">${esc(c)}</button>`).join('')}</div></div>
  <div class="section glass" style="margin-top:8px">`;
  if(!list.length) html+=`<div class="empty"><b>Sin resultados</b>Prueba con el apellido o con la ciudad del hospital.</div>`;
  list.forEach(s=>{html+=`<button class="row" data-sp="${s.id}"><span class="av-lg" style="background:${avColor(s.n)}">${initials(s.n)}</span><span><div class="n">${esc(s.n)}</div><div class="o">${esc(s.o)}</div></span><span class="c" aria-label="${s.items.length} intervenciones">${s.items.length}</span></button>`});
  html+=`</div>`;
  $('#view').innerHTML=html;
  const inp=$('#q'); if(inp&&q){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}

function render(){
  const v=$('#view'); v.classList.remove('fade'); void v.offsetWidth;
  ({agenda:renderAgenda,ponentes:renderPonentes,feria:renderFeria,albacete:renderAlbacete,info:renderInfo})[state.tab]();
  v.classList.add('fade');
}

/* ============ SHEET ============ */
function openSheet(html){$('#sheet').innerHTML=`<div class="handle"></div>${html}`;$('#sheet').classList.add('open');$('#sheetBd').classList.add('open');$('#sheet').scrollTop=0;document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheetBd').classList.remove('open');document.body.style.overflow=''}
function findItem(id){return ALL.find(x=>x.id===id)||PROGRAM.find(b=>b.id===id)}
function sheetSession(id){
  const x=findItem(id); if(!x) return;
  const day=DAYS.find(d=>d.id===x.day);
  const block=x.block||(x.type==='block'?x:null);
  const isBlockOnly=x.type==='block'||x.isBlock;
  const title=x.title; const roles=x.roles||{};
  const details=`${block&&!isBlockOnly?block.kind+': '+block.title+'\n':''}Cardiocete 2026 · ${VENUE.name}`;
  let h=`<div class="k">${day.label} ${day.num} · ${x.s}–${x.e}${block&&!isBlockOnly?' · '+esc(block.kind):''}</div><h3>${esc(title)}</h3>`;
  if(block&&!isBlockOnly) h+=`<div class="m">Dentro de la mesa «${esc(block.title)}»</div>`;
  if(x.sub) h+=`<div class="m">${esc(x.sub)}</div>`;
  const groups=[['caso','pon','exp'],['mod','pan']];
  const src=isBlockOnly?(x.roles||block.roles):roles;
  const rolesToShow=isBlockOnly?src:roles;
  const rows=order=>Object.entries(rolesToShow).filter(([r])=>order.includes(r)).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])).flatMap(([r,ids])=>ids.map(pid=>{const p=person(pid);return `<button class="prow" data-sp="${pid}" style="width:100%;text-align:left"><span class="av-lg" style="width:38px;height:38px;font-size:13px;background:${avColor(p.n)}">${initials(p.n)}</span><span><div class="rr">${ROLE_LABEL[r]}</div><div class="n">${esc(p.n)}</div><div class="o">${esc(p.o)}</div></span></button>`})).join('');
  const r1=rows(groups[0]); if(r1) h+=`<div class="grp"><h4>Intervienen</h4>${r1}</div>`;
  if(isBlockOnly){const r2=rows(groups[1]); if(r2) h+=`<div class="grp"><h4>Moderan y panel</h4>${r2}</div>`}
  else if(block){const r2=Object.entries(block.roles).flatMap(([r,ids])=>ids.map(pid=>{const p=person(pid);return `<button class="prow" data-sp="${pid}" style="width:100%;text-align:left"><span class="av-lg" style="width:38px;height:38px;font-size:13px;background:${avColor(p.n)}">${initials(p.n)}</span><span><div class="rr">${ROLE_LABEL[r]}</div><div class="n">${esc(p.n)}</div><div class="o">${esc(p.o)}</div></span></button>`})).join(''); if(r2) h+=`<div class="grp"><h4>Moderan y panel de la mesa</h4>${r2}</div>`}
  const favable=x.type!=='plain'||true;
  const on=favs.has(id);
  h+=`<div class="btn-row"><button class="btn ${on?'':'primary'}" data-fav="${id}" id="sheetFav">${on?'★ En mi agenda':'☆ Guardar en mi agenda'}</button>
      <a class="btn" href="${gcal(title,day.d,x.s,x.e==='23:59'?'23:30':x.e,details,VENUE.name+', '+VENUE.addr)}" target="_blank" rel="noopener">Añadir al calendario</a></div>`;
  if(navigator.share) h+=`<button class="btn" style="width:100%;margin-top:8px" id="shareBtn" data-share="${esc(`${title} · ${day.label} ${day.num} ${x.s}–${x.e} · Cardiocete 2026`)}">Compartir sesión</button>`;
  openSheet(h);
}
function sheetSpeaker(pid){
  const s=SPEAKERS[pid]; if(!s) return;
  let h=`<div style="display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center"><span class="av-lg" style="width:56px;height:56px;font-size:19px;background:${avColor(s.n)}">${initials(s.n)}</span><div><h3 style="margin:0">${esc(s.n)}</h3><div class="m">${esc(s.o)}</div></div></div>`;
  const items=[...s.items].sort((a,b)=>(a.day+a.s).localeCompare(b.day+b.s));
  h+=`<div class="grp"><h4>${items.length===1?'Su intervención':'Sus intervenciones'}</h4>`;
  items.forEach(it=>{const d=DAYS.find(x=>x.id===it.day);h+=`<button class="srow" data-open="${it.sid}"><span class="t">${d.short} ${d.num}<br>${it.s}<small>${ROLE_SHORT[it.role]}</small></span><span><div class="ti">${esc(it.title)}</div><div class="ro">${it.block?'Mesa completa':''}${it.block?' · ':''}${it.s}–${it.e}</div></span></button>`});
  h+=`</div>`;
  openSheet(h);
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){setTab(tab.dataset.tab);return}
  const day=e.target.closest('[data-day]'); if(day){state.day=day.dataset.day;render();return}
  if(e.target.closest('#favToggle')){state.onlyFavs=!state.onlyFavs;render();return}
  const fav=e.target.closest('[data-fav]'); if(fav){const id=fav.dataset.fav;const on=favs.has(id);on?favs.delete(id):favs.add(id);saveFavs();toast(on?'Quitada de tu agenda':'Guardada en tu agenda');
    if(fav.id==='sheetFav'){fav.textContent=on?'☆ Guardar en mi agenda':'★ En mi agenda';fav.classList.toggle('primary',on)}
    if(state.tab==='agenda')render(); return}
  const sp=e.target.closest('[data-sp]'); if(sp){sheetSpeaker(sp.dataset.sp);return}
  const op=e.target.closest('[data-open]'); if(op){sheetSession(op.dataset.open);return}
  const pf=e.target.closest('[data-pf]'); if(pf){state.pf=pf.dataset.pf;render();return}
  if(e.target.closest('#sheetBd')){closeSheet();return}
  if(e.target.closest('#copyLink')){(navigator.clipboard?navigator.clipboard.writeText(APP_URL):Promise.reject()).then(()=>toast('Enlace copiado')).catch(()=>{prompt('Copia el enlace',APP_URL)});return}
  if(e.target.closest('#shareApp')){navigator.share({title:'Cardiocete 2026',text:'Guía del congreso Cardiocete 2026',url:APP_URL}).catch(()=>{});return}
  const sh=e.target.closest('#shareBtn'); if(sh){navigator.share({title:'Cardiocete 2026',text:sh.dataset.share}).catch(()=>{});return}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;renderPonentes()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
// swipe down to close sheet
(()=>{let y0=null;const sh=$('#sheet');sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
sh.addEventListener('touchmove',e=>{if(y0!==null&&e.touches[0].clientY-y0>70){closeSheet();y0=null}},{passive:true})})();

renderTabs();render();
setInterval(()=>{if(state.tab==='agenda'&&!$('#sheet').classList.contains('open'))render()},60000);
</script>
